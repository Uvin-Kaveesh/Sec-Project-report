spring.application.name=club-projects

# ---------- SQLite ----------
# The database file is created next to the app on first run.
spring.datasource.url=jdbc:sqlite:${CLUB_DB_PATH:data/club-projects.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows exactly one writer at a time, so keep a single pooled connection.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.pool-name=sqlite-pool

# ---------- JPA / Hibernate ----------
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Set to true while debugging to see the generated SQL.
spring.jpa.show-sql=false

# ---------- Admin ----------
# Shared password that unlocks deleting projects and committee members.
# CHANGE THIS before the club uses it. It can also be supplied without editing
# this file, via an environment variable:  CLUB_ADMIN_PASSWORD=...
club.admin.password=${CLUB_ADMIN_PASSWORD:leo-admin-2026}

# ---------- Uploads ----------
# Thumbnails are shrunk in the browser before upload; these are the safety net.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# ---------- Web ----------
server.port=${PORT:8080}
spring.jackson.default-property-inclusion=always
spring.web.resources.cache.cachecontrol.no-cache=true
# Resolve static files on every request instead of caching them in memory, so
# edits to the HTML/CSS/JS show up on a browser refresh without a restart.
spring.web.resources.chain.cache=false

# ---------- Logging ----------
logging.level.lk.leoclub=INFO
